<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tantangan DOM: Notes App</title>
    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h2>Aplikasi Catatan Kecil</h2>
    <input type="text" id="noteInput" placeholder="Tulis catatan baru...">
    <button id="addNoteBtn">Tambah Catatan</button>

    <ul id="noteList"></ul>

    <script>
        const noteInput = document.getElementById('noteInput')
        const button = document.getElementById('addNoteBtn')
        const list = document.getElementById('noteList')


        //localStorage 
        let simpanCatatan = JSON.parse(localStorage.getItem('daftarCatatan')) || []

        function tampilkanCatatan() {
            list.innerHTML = ''

            simpanCatatan.forEach(function(textCatatan){
                const li = document.createElement('li')
                li.textContent = textCatatan

                list.appendChild(li)
            })
        }

        button.addEventListener('click', function() {
            noteText = noteInput.value.trim()

            if (noteText === '') {
                alert('catatan tidak boleh kosong!')
                return;
            }

            const li = document.createElement('li')
            li.textContent = noteText;

            li.addEventListener('click', function(){
                li.classList.toggle('completed')
            })

            const deleteNote = document.createElement('button')
                deleteNote.textContent = 'hapus' 
                deleteNote.style.margin = '5px'
                
                deleteNote.addEventListener('click', function(e){
                    e.stopPropagation()
                    li.remove()
                })
            
            li.appendChild(deleteNote)
            list.appendChild(li)

            noteInput.value = ''

        })
        // Tulis kode JavaScript-mu di sini!
        // 1. Ambil elemen (noteInput, addNoteBtn, noteList)
        // 2. Tambahkan event listener 'click' pada tombol
        // 3. Buat validasi trim() & alert jika kosong
        // 4. Buat elemen <li>, beri textContent
        // 5. Tambahkan event listener 'click' untuk toggle coret di <li>
        // 6. Buat tombol hapus, beri event listener .remove()
        // 7. Gabungkan semuanya ke noteList dan bersihkan input
    </script>
</body>
</html>
